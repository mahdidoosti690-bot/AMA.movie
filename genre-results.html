<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070B14">
<title>نتایج ژانرها | آما مووی</title>
<link rel="stylesheet" href="./output.css">
<style>
@font-face{font-family:Vazirmatn;src:url("./font/yekan-regular.woff") format("woff");font-display:swap}
body{font-family:Vazirmatn,sans-serif;background:#070b14;color:#f8fafc}
.movie-card{overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:1rem;background:#091426}
.poster{aspect-ratio:2/3;background:#13213a;display:flex;align-items:center;justify-content:center;color:#94a3b8}
</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-10 border-b border-white/10 bg-slate-950/80 px-5 py-4 backdrop-blur-xl">
<div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
<a href="./index.html#home" class="text-xl font-black">آما <span class="text-blue-500">مووی</span></a>
<a href="./index.html#genres" class="rounded-full bg-blue-600 px-4 py-2 text-sm font-bold text-white">تغییر ژانرها</a>
</div>
</header>
<main class="mx-auto max-w-7xl px-5 py-10">
<p class="text-sm font-bold text-blue-400">پیشنهادشده بر اساس انتخاب تو</p>
<h1 class="mt-2 text-3xl font-black">نتایج ژانرهای انتخاب‌شده</h1>
<p id="selected-genres" class="mt-3 text-slate-400"></p>
<div id="results" class="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"></div>
<p id="empty" class="mt-8 hidden rounded-2xl border border-white/10 p-6 text-slate-300">فعلاً فیلمی با این ژانرها در فهرست نمونه وجود ندارد. وقتی اطلاعات فیلم‌ها به منبع داده یا ربات متصل شود، این صفحه می‌تواند نتایج کامل را نمایش دهد.</p>
</main>
<script>
const movies = [
 {title:"تلماسه",year:"۲۰۲۴",rating:"۸.۵",genres:["علمی تخیلی","ماجراجویی"],poster:"./images/movies/dune.jpg"},
 {title:"بتمن",year:"۲۰۲۲",rating:"۷.۸",genres:["اکشن","درام"],poster:"./images/movies/batman.jpg"},
 {title:"میان‌ستاره‌ای",year:"۲۰۱۴",rating:"۸.۶",genres:["علمی تخیلی","ماجراجویی","درام"],poster:"./images/movies/interstellar.jpg"},
 {title:"جان ویک",year:"۲۰۱۴",rating:"۷.۴",genres:["اکشن"],poster:"./images/movies/john-wick.jpg"},
 {title:"گرگ وال استریت",year:"۲۰۱۳",rating:"۸.۲",genres:["درام","کمدی"],poster:"./images/movies/wolf.jpg"},
 {title:"تلقین",year:"۲۰۱۰",rating:"۸.۸",genres:["اکشن","علمی تخیلی"],poster:"./images/movies/inception.jpg"}
];
const params = new URLSearchParams(location.search);
const selected = (params.get("genres") || "").split(",").filter(Boolean);
document.getElementById("selected-genres").textContent = selected.length ? "ژانرها: " + selected.join("، ") : "هیچ ژانری انتخاب نشده است.";
const matched = movies.filter(movie => selected.some(genre => movie.genres.includes(genre)));
const results = document.getElementById("results");
matched.forEach(movie => {
 const card = document.createElement("article");
 card.className = "movie-card";
 const img = document.createElement("img");
 img.src = movie.poster; img.alt = "پوستر " + movie.title; img.loading = "lazy";
 img.className = "poster w-full object-cover";
 img.onerror = () => { img.replaceWith(Object.assign(document.createElement("div"), {className:"poster", textContent:"پوستر در دسترس نیست"})); };
 const details = document.createElement("div"); details.className = "p-3";
 const title = document.createElement("h2"); title.className = "font-bold"; title.textContent = movie.title;
 const meta = document.createElement("p"); meta.className = "mt-2 text-xs text-slate-400"; meta.textContent = movie.year + "　 ★ " + movie.rating;
 const genres = document.createElement("p"); genres.className = "mt-2 text-xs text-blue-400"; genres.textContent = movie.genres.join("، ");
 details.append(title, meta, genres); card.append(img, details); results.append(card);
});
document.getElementById("empty").classList.toggle("hidden", matched.length > 0);
</script>
</body>
</html>
